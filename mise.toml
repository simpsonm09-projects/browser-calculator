# Tools for browser-calculator. Versions match the owner standard's pinning table.
# See https://github.com/simpsonm09-projects/repo-standard/blob/main/docs/linting.md

[tools]

# Task runner
"aqua:casey/just" = "1.59.0"

# CI linters
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.30.1"

# JavaScript and TypeScript toolchain
bun = "1.4.5"

# The service runs on Node in the container; Bun runs the scripts and the tests.
node = "26.13.1"
"npm:oxlint" = "1.93.0"

# Linters
"aqua:grafana/flint" = "0.22.14"

[env]
FLINT_CONFIG_DIR = ".github/config"
